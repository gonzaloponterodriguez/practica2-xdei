<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#f5f5f5"/>
  
  <!-- Coconut -->
  <g id="coconut">
    <!-- Main coconut shell (brown) -->
    <circle cx="200" cy="150" r="85" fill="#8B4513" stroke="#6B3410" stroke-width="3"/>
    
    <!-- Texture/fiber details on coconut -->
    <circle cx="160" cy="110" r="12" fill="#A0522D" opacity="0.7"/>
    <circle cx="240" cy="115" r="10" fill="#A0522D" opacity="0.7"/>
    <circle cx="150" cy="160" r="11" fill="#A0522D" opacity="0.7"/>
    <circle cx="250" cy="155" r="12" fill="#A0522D" opacity="0.7"/>
    <circle cx="175" cy="200" r="10" fill="#A0522D" opacity="0.7"/>
    <circle cx="225" cy="205" r="11" fill="#A0522D" opacity="0.7"/>
    
    <!-- Lighter spots for 3D effect -->
    <ellipse cx="180" cy="130" rx="15" ry="12" fill="#A0522D" opacity="0.5"/>
    <ellipse cx="220" cy="125" rx="12" ry="16" fill="#A0522D" opacity="0.4"/>
    
    <!-- Three "eyes" on coconut (characteristic) -->
    <circle cx="185" cy="155" r="6" fill="#654321"/>
    <circle cx="200" cy="165" r="6" fill="#654321"/>
    <circle cx="215" cy="155" r="6" fill="#654321"/>
    
    <!-- Fiber/husk at top -->
    <g id="husk">
      <!-- Fiber 1 -->
      <path d="M 175 70 Q 170 50 165 40" stroke="#8B7355" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Fiber 2 -->
      <path d="M 200 65 Q 200 45 200 30" stroke="#8B7355" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Fiber 3 -->
      <path d="M 225 70 Q 230 50 235 40" stroke="#8B7355" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Fiber 4 -->
      <path d="M 180 68 Q 175 48 172 35" stroke="#8B7355" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
      <!-- Fiber 5 -->
      <path d="M 220 68 Q 225 48 228 35" stroke="#8B7355" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
    </g>
    
    <!-- Highlights for glossiness -->
    <ellipse cx="170" cy="120" rx="25" ry="30" fill="white" opacity="0.15"/>
  </g>
  
  <!-- Label -->
  <text x="200" y="260" font-size="28" font-weight="bold" fill="#333" text-anchor="middle" font-family="Arial">
    Coconuts
  </text>
</svg>
